  const a = t * 1.2;

  orb(1, W * .88 - Math.cos(a) * 9, 14 - Math.sin(a) * 9, 3, t);
  tx('FIRE + ICE', W / 2, 6, P.yw, 3, 'c', P.pu);
  tx('TAP ON THE BEAT', W / 2, 24, P.lg, 1, 'c', P.k);
  tp = clampTop(tp);
  const v = vis();
  tx(`${tp + 1}-${Math.min(NL, tp + v)} OF ${NL}`, W - 8, 24, P.gr, 1, 'r');
  for (let k = 0; k < v; k++) {
    const i = tp + k, y = 36 + k * ROW, m = LV[i], r = REC[i], on = unlocked(i), s = i === sel;
    if (s) box(12, y - 2, W - 24, 13, P.pu);
    const lab = `${i + 1} ${m.name}`;
    tx(lab, 20, y, on ? P.wh : P.gr, 1, 'l', P.k);
    if (r && on) tx(r.g, 20 + lab.length * 4 + 3, y, GC[r.g], 1, 'l', P.k);
    if (on) tx(m.endless ? 'RAMPS UP' : `${m.bpm} BPM ${m.taps} BEATS`, 20, y + 6, P.lg);
    else tx(`CLEAR ${i} FIRST`, 20, y + 6, P.gr);
    miniPath(i, W - 70, y - 1, 50, 11);
    hits.push({ x: 12, y: y - 2, w: W - 24, h: 13, i });
  }
  const so = sel === NL;
  if (so) box(12, H - 30, W - 24, 15, P.pu);
  tx('OFFSET', 20, H - 26, so ? P.yw : P.wh, 1, 'l', P.k);
  tx(`${calMs()} MS`, 60, H - 26, P.yw, 1, 'l', P.k);
  tx('LEFT RIGHT ADJUST', 20, H - 19, P.gr);
  hits.push({ x: 12, y: H - 30, w: W - 24, h: 15, i: NL });
  tx('ENTER PLAY  P PAUSE  Q QUIT', W / 2, H - 9, P.gr, 1, 'c');
}
function drawWorld(g, t) {
  const c = G.cur, X = G.X, Y = G.Y, tb = 60 / G.B[Math.min(c, G.B.length - 1)];
  const sx = G.sh ? Math.round((Math.random() * 2 - 1) * G.sh) : 0, sy = G.sh ? Math.round((Math.random() * 2 - 1) * G.sh) : 0;
  const Q = (x, y) => { const q = sc(x, y); return [q[0] + sx, q[1] + sy]; };
  const lo = Math.max(0, c - 8), hi = Math.min(X.length - 1, c + 22);
  for (let j = lo; j < hi; j++) {
    const a = Q(X[j], Y[j]), b = Q(X[j + 1], Y[j + 1]), n = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1])));
    for (let s = 0; s <= n; s++) {
      const x = Math.round(a[0] + (b[0] - a[0]) * s / n), y = Math.round(a[1] + (b[1] - a[1]) * s / n);
      if (j >= c) px(x, y, P.wh); else if (s % 3 === 0) px(x, y, P.gr);
    }
  }
  for (let j = c + 2; j < hi; j++) { const a = Q(X[j], Y[j]); px(a[0], a[1] - 1, P.lg); px(a[0] - 1, a[1], P.lg); px(a[0], a[1], P.lg); px(a[0] + 1, a[1], P.lg); px(a[0], a[1] + 1, P.lg); }
  const L = Q(X[c + 1], Y[c + 1]), tl = Math.min(1, Math.max(0, G.T[c] - g) / tb), hw = Math.round(4 + 12 * tl);
  box(L[0] - hw, L[1] - hw, 2 * hw + 1, 1, P.yw); box(L[0] - hw, L[1] + hw, 2 * hw + 1, 1, P.yw);
  box(L[0] - hw, L[1] - hw, 1, 2 * hw + 1, P.yw); box(L[0] + hw, L[1] - hw, 1, 2 * hw + 1, P.yw);
  const an = orbit(c, fr(g, c)), pv = Q(X[c], Y[c]), oq = Q(X[c] + Math.cos(an), Y[c] + Math.sin(an));
  for (let k = 0; k < 48; k += 2) { const q = Q(X[c] + Math.cos(k / 48 * TAU), Y[c] + Math.sin(k / 48 * TAU)); px(q[0], q[1], P.gr); }
  G.trail.forEach((p, i) => { const q = Q(p[0], p[1]); px(q[0], q[1], i < G.trail.length - 2 ? P.gr : p[2]); });
  if (c % 2 === 0) { orb(0, pv[0], pv[1], 5, t); orb(1, oq[0], oq[1], 5, t); }
  else { orb(1, pv[0], pv[1], 5, t); orb(0, oq[0], oq[1], 5, t); }
  for (const p of G.parts) { const q = Q(p.x, p.y); if (p.t < p.life * .6) box(q[0], q[1], 2, 2, p.c); else px(q[0], q[1], p.c); }
  for (const s of G.stamps) { const q = Q(s.x, s.y); tx(s.s, q[0], q[1] - 8 - s.t * 10, s.c, 1, 'c', P.k); }
}
function drawHUD(g) {
  const m = G.m, c = G.cur;
  tx(`${G.idx + 1} ${m.name}`, 6, 6, P.wh, 1, 'l', P.k);
  tx(`${G.B[Math.min(c, G.B.length - 1)]} BPM`, 6, 14, P.lg, 1, 'l', P.k);
  for (let i = 0; i < 3; i++) spr(HEART, 6 + i * 7, 23, i < G.lives ? P.rd : P.gr);
  tx(G.score, W - 6, 6, P.yw, 1, 'r', P.k);
  tx(`STREAK ${G.combo} X${1 + Math.min(4, Math.floor(G.combo / 10))}`, W - 6, 14, P.lg, 1, 'r', P.k);
  if (!m.endless) { box(6, H - 6, W - 12, 2, P.gr); box(6, H - 6, (W - 12) * Math.min(1, G.nj / m.taps), 2, P.og); }
  if (state === 'play') {
    box(W - 16, H - 20, 2, 9, P.lg); box(W - 12, H - 20, 2, 9, P.lg);
    if (g < G.T[0] - .15) tx('READY', W / 2, 40, P.yw, 2, 'c', P.k);
  }
}
function drawPause() {
  tx('PAUSED', W / 2, OY + 40, P.yw, 2, 'c', P.k);
  drawItems(OY + 72, 16);
  tx('ENTER PICK  P RESUME', W / 2, H - 9, P.gr, 1, 'c');
}
function drawResult() {
  const R = RES;
  tx(R.win ? 'TRACK CLEARED' : 'OUT OF HEARTS', W / 2, OY + 12, P.yw, 2, 'c', P.k);
  tx(R.grade, W / 2, OY + 30, R.col, 6, 'c', P.k);
  tx(R.flav, W / 2, OY + 64, P.lg, 1, 'c', P.k);
  tx(`SCORE ${R.score}`, W / 2, OY + 78, P.wh, 1, 'c', P.k);
  tx(`ACC ${R.acc}% BEST STREAK ${R.best}`, W / 2, OY + 88, P.lg, 1, 'c');
  tx(`PERFECT ${R.cnt[0]} GOOD ${R.cnt[1]} OK ${R.cnt[2]} MISS ${R.cnt[3]}`, W / 2, OY + 98, P.gr, 1, 'c');
  if (R.fresh) tx('NEW BEST!', W / 2, OY + 110, P.gn, 1, 'c', P.k);
  drawItems(OY + 124, 14);
  tx('ENTER PICK  Q TRACK LIST', W / 2, H - 9, P.gr, 1, 'c');
}
function draw(g, t) {
  OY = Math.max(0, Math.floor((H - 180) / 2));
  hits = [];
  box(0, 0, W, H, P.nb);
  for (const s of STARS) px(Math.floor(s[0] * W), Math.floor(s[1] * H), Math.sin(t * 2 + s[2]) > .3 ? P.lg : P.gr);
  if (!G) { drawMenu(t); return; }
  drawWorld(g, t);
  drawHUD(g);
  if (state === 'count') { if (cd > 0) tx(String(cd), W / 2, H / 2 - 15, P.yw, 6, 'c', P.k); }
  else if (state === 'pause') { dim(); drawPause(); }
  else if (state === 'done' || state === 'fail') { dim(); drawResult(); }
}

function pad() {
  const gl = navigator.getGamepads ? navigator.getGamepads() : [];
  let gp = null;
  for (const x of gl) if (x) { gp = x; break; }
  if (!gp) return;
  const pr = gp.buttons.map(b => b.pressed), ed = i => !!pr[i] && !gpPrev[i];
  if (ed(0)) { if (state === 'play') press(); else if (state !== 'count') act(sel); }
  if (ed(1) && state !== 'play' && state !== 'count' && state !== 'menu') toMenu();
  if (ed(9)) { if (state === 'play') pause(); else if (state === 'pause') resume(); }
  if (state !== 'play' && state !== 'count') { if (ed(12)) move(-1); if (ed(13)) move(1); }
  if (ed(14)) nudge(-1);
  if (ed(15)) nudge(1);
  gpPrev.length = 0; pr.forEach(v => gpPrev.push(v));
}
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000), t = now / 1000;
  last = now;
  pad();
  let g = 0;
  if (G) { g = state === 'done' || state === 'fail' ? endG : ac.currentTime - G.gs; if (state === 'play') update(g, dt); }
  draw(g, t);
  requestAnimationFrame(frame);
}
function fit() {
  const dw = cv.clientWidth || innerWidth, dh = cv.clientHeight || innerHeight, a = dw / dh;
  if (a >= 1) { H = 180; W = Math.round(Math.max(200, Math.min(620, 180 * a))); }
  else { W = 200; H = Math.round(Math.min(560, 200 / a)); }
  cv.width = W; cv.height = H;
}

addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key, K = k.toLowerCase();
  if (state === 'play') {
    if (K === 'escape' || K === 'p') pause();
    else if (K === 'q') toMenu();
    else if (!IGN.includes(k)) { e.preventDefault(); press(); }
    return;
  }
  if (state === 'count') return;
  if (K === 'arrowup' || K === 'w') move(-1);
  else if (K === 'arrowdown' || K === 's') move(1);
  else if (K === 'pageup') move(-vis());
  else if (K === 'pagedown') move(vis());
  else if (K === 'arrowleft' || K === 'a') nudge(-1);
  else if (K === 'arrowright' || K === 'd') nudge(1);
  else if (K === 'enter' || K === ' ') { e.preventDefault(); act(sel); }
  else if (K === 'escape' || K === 'p') { if (state === 'pause') resume(); }
  else if (K === 'q') { if (state !== 'menu') toMenu(); }
});
function ptr(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => {
  const q = ptr(e);
  if (state === 'play') {
    e.preventDefault();
    if (q.x >= W - 22 && q.y >= H - 26) pause(); else press();
    return;
  }
  DR = { y: q.y, t0: tp, moved: false };
});
cv.addEventListener('pointermove', e => {
  if (!DR) return;
  const q = ptr(e), dy = q.y - DR.y;
  if (Math.abs(dy) > 3) DR.moved = true;
  if (DR.moved && state === 'menu') tp = clampTop(DR.t0 - Math.round(dy / ROW));
});
cv.addEventListener('pointerup', e => {
  if (!DR) return;
  const d = DR; DR = null;
  if (d.moved) return;
  const q = ptr(e);
  for (const h of hits) {
    if (q.x >= h.x && q.x < h.x + h.w && q.y >= h.y && q.y < h.y + h.h) {
      sel = h.i;
      if (items[h.i] && items[h.i].off) nudge(q.x < W / 2 ? -1 : 1); else act(h.i);
      break;
    }
  }
});
cv.addEventListener('pointercancel', () => { DR = null; });
addEventListener('wheel', e => { if (state === 'menu') tp = clampTop(tp + (e.deltaY > 0 ? 1 : -1)); }, { passive: true });
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('resize', fit);
addEventListener('orientationchange', fit);
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') pause(); });
buildMain(); fit(); requestAnimationFrame(frame);
</script>
